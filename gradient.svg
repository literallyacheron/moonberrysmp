<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="60" viewBox="0 0 400 60" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"/>
      <animateTransform attributeName="gradientTransform" type="translate" dur="5s" repeatCount="indefinite" values="0 0; 50 0; 0 0"/>
    </linearGradient>
    <style>
      .gradient-text {
        font-family: Ubuntu Mono, monospace;
        font-size: 30px;
        fill: url(#textGradient);
        font-weight: 600;
        text-rendering: optimizeLegibility;
      }
      .gradient-cursor {
        fill: url(#textGradient);
        animation: gradientBlink 1.4s ease-in-out infinite;
      }
      @keyframes gradientBlink {
        0%, 55% { opacity: 1; filter: brightness(1); }
        60%, 90% { opacity: 0.4; filter: brightness(1.1); }
        100% { opacity: 1; filter: brightness(1); }
      }
      .gradient-char {
        opacity: 0;
        animation: gradientType 0.6s linear 0.5s forwards, shimmer 4s ease-in-out infinite;
      }
      .emoji-icon {
        opacity: 0;
        animation: gradientType 0.6s linear 0.5s forwards, shimmerEmoji 4s ease-in-out infinite;
      }
      @keyframes gradientType {
        0% { opacity: 0; transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes shimmer {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.15); }
      }
      @keyframes shimmerEmoji {
        0%, 100% { filter: brightness(1) contrast(1); }
        50% { filter: brightness(1.1) contrast(1.05); }
      }
      @media (prefers-reduced-motion: reduce) {
        .gradient-char, .emoji-icon { animation: none; opacity: 1; transform: scale(1); filter: brightness(1); }
        .gradient-cursor { animation: none; opacity: 1; filter: brightness(1); }
      }
    </style>
  </defs>
  
  <rect width="400" height="60" fill="transparent" rx="3"/>
  
  <g class="gradient-text">
    <text x="20" y="40" class="gradient-text">
                  <tspan class="gradient-char" style="animation-delay: 0s">M</tspan>
                </text><text x="38" y="40" class="gradient-text">
                  <tspan class="gradient-char" style="animation-delay: 0.05s">o</tspan>
                </text><text x="56" y="40" class="gradient-text">
                  <tspan class="gradient-char" style="animation-delay: 0.1s">o</tspan>
                </text><text x="74" y="40" class="gradient-text">
                  <tspan class="gradient-char" style="animation-delay: 0.15s">n</tspan>
                </text><text x="92" y="40" class="gradient-text">
                  <tspan class="gradient-char" style="animation-delay: 0.2s">b</tspan>
                </text><text x="110" y="40" class="gradient-text">
                  <tspan class="gradient-char" style="animation-delay: 0.25s">e</tspan>
                </text><text x="128" y="40" class="gradient-text">
                  <tspan class="gradient-char" style="animation-delay: 0.3s">r</tspan>
                </text><text x="146" y="40" class="gradient-text">
                  <tspan class="gradient-char" style="animation-delay: 0.35s">r</tspan>
                </text><text x="164" y="40" class="gradient-text">
                  <tspan class="gradient-char" style="animation-delay: 0.4s">y</tspan>
                </text><text x="182" y="40" class="gradient-text">
                  <tspan class="gradient-char" style="animation-delay: 0.45s">S</tspan>
                </text><text x="200" y="40" class="gradient-text">
                  <tspan class="gradient-char" style="animation-delay: 0.5s">M</tspan>
                </text><text x="218" y="40" class="gradient-text">
                  <tspan class="gradient-char" style="animation-delay: 0.55s">P</tspan>
                </text>
    
    
  </g>
</svg>