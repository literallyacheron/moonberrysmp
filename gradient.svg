<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="60" viewBox="0 0 400 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dein neuer Farbverlauf -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0080"/>
      <stop offset="100%" stop-color="#C082FF"/>
    </linearGradient>
    
    <style>
      .gradient-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 32px;
        fill: url(#textGradient);
        font-weight: 700;
        text-rendering: optimizeLegibility;
      }
    </style>
  </defs>
  
  <rect width="400" height="60" fill="transparent"/>
  
  <!-- Einzelner Textblock mit präzisen X-Abständen für perfekten Spacing -->
  <text x="20" y="42" class="gradient-text">
    <tspan x="20" opacity="0">M<animate attributeName="opacity" to="1" begin="0.0s" dur="0.35s" fill="freeze"/></tspan>
    <tspan x="49" opacity="0">o<animate attributeName="opacity" to="1" begin="0.10s" dur="0.35s" fill="freeze"/></tspan>
    <tspan x="68" opacity="0">o<animate attributeName="opacity" to="1" begin="0.2s" dur="0.35s" fill="freeze"/></tspan>
    <tspan x="87" opacity="0">n<animate attributeName="opacity" to="1" begin="0.3s" dur="0.35s" fill="freeze"/></tspan>
    <tspan x="106" opacity="0">b<animate attributeName="opacity" to="1" begin="0.4s" dur="0.35s" fill="freeze"/></tspan>
    <tspan x="125" opacity="0">e<animate attributeName="opacity" to="1" begin="0.5s" dur="0.35s" fill="freeze"/></tspan>
    <tspan x="143" opacity="0">r<animate attributeName="opacity" to="1" begin="0.6s" dur="0.35s" fill="freeze"/></tspan>
    <tspan x="156" opacity="0">r<animate attributeName="opacity" to="1" begin="0.7s" dur="0.35s" fill="freeze"/></tspan>
    <tspan x="169" opacity="0">y<animate attributeName="opacity" to="1" begin="0.8s" dur="0.35s" fill="freeze"/></tspan>
    <tspan x="185" opacity="0">S<animate attributeName="opacity" to="1" begin="0.9s" dur="0.35s" fill="freeze"/></tspan>
    <tspan x="200" opacity="0">M<animate attributeName="opacity" to="1" begin="1s" dur="0.2s" fill="freeze"/></tspan>
    <tspan x="215" opacity="0">P<animate attributeName="opacity" to="1" begin="1.1s" dur="0.2s" fill="freeze"/></tspan>
  </text>
</svg>
